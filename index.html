<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyash Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #23b5ff;
            --bg-color: #f7f9fb;
            --text-main: #1a1a1a;
            --text-sub: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 画面いっぱいに表示するコンテナ */
        .phone-container {
            width: 100%;
            max-width: 450px; 
            height: 100vh;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- ヘッダー --- */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
        }

        .header-icon {
            font-size: 20px;
            color: var(--text-main);
            cursor: pointer;
            width: 30px;
        }

        .header-title {
            font-weight: bold;
            font-size: 17px;
            color: var(--text-main);
        }

        /* --- メインコンテンツエリア --- */
        .content {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #ffffff;
            padding: 10px 16px 80px 16px; 
            box-sizing: border-box;
        }

        /* カード選択のインジケーター */
        .dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #c7c7cc;
        }
        .dot.active {
            background-color: #007aff;
        }

        /* Kyashリアルカード風デザイン */
        .card-wrapper {
            position: relative;
            margin-bottom: 25px;
        }
        .kyash-card {
            background: linear-gradient(135deg, #20dbff 0%, #0084ff 100%);
            border-radius: 16px;
            aspect-ratio: 1.58 / 1; 
            padding: 20px;
            color: white;
            box-shadow: 0 8px 24px rgba(0, 132, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        .card-logo {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
        }
        .card-chip {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            opacity: 0.8;
        }
        .card-number {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 10px;
        }
        .card-brand {
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            text-align: left;
        }

        /* 残高 & ポイントセクション */
        .balance-section {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid #f2f2f7;
            padding-bottom: 15px;
        }
        .balance-item {
            text-align: center;
            cursor: pointer;
            flex: 1;
        }
        .balance-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .balance-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .balance-value span.p-icon {
            background-color: #007aff;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* アクションボタン群 */
        .action-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }
        .action-box {
            flex: 1;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            background: #fff;
            box-sizing: border-box;
        }
        .action-box i {
            font-size: 18px;
            color: #007aff;
        }

        /* Google Pay エリア */
        .gpay-banner {
            background-color: #f2f2f7;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .gpay-btn {
            background-color: #000;
            color: white;
            border-radius: 20px;
            padding: 8px 24px;
            display: inline-flex;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .gpay-text {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* 下部バナーリスト */
        .banner-list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .banner-card {
            min-width: 160px;
            background-color: #fff9f5;
            border: 1px solid #ffebe0;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .banner-card.blue {
            background-color: #f0f4ff;
            border-color: #e0e8ff;
        }
        .banner-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .banner-desc {
            font-size: 10px;
            color: var(--text-sub);
            line-height: 1.3;
        }

        /* --- 下部ナビゲーションバー --- */
        .nav-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65px;
            background-color: #ffffff;
            border-top: 1px solid #f2f2f7;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            padding-bottom: 10px; 
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 10px;
            cursor: pointer;
            text-decoration: none;
            width: 20%;
        }
        .nav-item.active {
            color: #007aff;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 3px;
        }

        /* --- 履歴画面（完全全画面表示に修正） --- */
        .history-screen {
            display: none;
            width: 100%;
            height: 100%; /* コンテナいっぱいに広げる */
            background-color: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50; /* ナビやヘッダーより上に表示 */
        }
        .history-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 画像の比率を守って全体を映す */
        }
        
        /* 画像の左上に重ねる戻るボタン */
        .history-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.5); /* 画像に紛れても見えやすく半透明に */
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
        }

        /* --- トースト --- */
        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header" id="mainHeader">
        <span class="header-icon" id="cardIcon"><i class="fa-regular fa-credit-card"></i></span>
        <div class="header-title">個人口座</div>
        <span class="header-icon" id="bellIcon" style="text-align: right;"><i class="fa-regular fa-bell"></i></span>
    </div>

    <div class="content" id="homeScreen">
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <div class="card-wrapper">
            <div class="kyash-card">
                <div class="card-logo">Kyash</div>
                <div class="card-chip"><i class="fa-solid fa-wifi"></i></div>
                <div class="card-number">•••• •••• •••• 1251</div>
                <div class="card-brand">VISA</div>
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-item" id="balanceBtn">
                <div class="balance-label">残高</div>
                <div class="balance-value">¥0 <i class="fa-solid fa-chevron-right" style="font-size: 11px; color:#c7c7cc;"></i></div>
            </div>
            <div class="balance-item" id="pointBtn">
                <div class="balance-label">ポイント</div>
                <div class="balance-value">
                    <span class="p-icon">P</span> 0 <i class="fa-solid fa-chevron-right" style="font-size: 11px; color:#c7c7cc;"></i>
                </div>
            </div>
        </div>

        <div class="action-row">
            <div class="action-box" id="withdrawBtn"><i class="fa-regular fa-circle-down"></i> 出金</div>
            <div class="action-box" id="chargeBtn"><i class="fa-regular fa-circle-up"></i> 入金(チャージ)</div>
            <div class="action-box" id="historyBtn"><i class="fa-solid fa-clock-rotate-left"></i> 履歴</div>
        </div>

        <div class="gpay-banner" id="gpayBtn">
            <div class="gpay-btn">G Pay に追加</div>
            <div class="gpay-text">Google Payを設定することで、Visaのタッチ決済が利用できます</div>
        </div>

        <div class="banner-list">
            <div class="banner-card" id="banner1">
                <div class="banner-title">オンライン決済</div>
                <div class="banner-desc">オンラインショップ、オンラインサービスでの支払い</div>
            </div>
            <div class="banner-card blue" id="banner2">
                <div class="banner-title">Visaのタッチ決済</div>
                <div class="banner-desc">Google Payを設定してタッチでスマートにお支払い</div>
            </div>
        </div>
    </div>

    <div class="history-screen" id="historyScreen">
        <button class="history-back-btn" id="historyBackBtn"><i class="fa-solid fa-chevron-left"></i></button>
        <img src="kkk.png" alt="履歴画面" class="history-img">
    </div>

    <div class="nav-bar" id="navBar">
        <div class="nav-item active" id="navWallet"><i class="fa-solid fa-wallet"></i><span>ウォレット</span></div>
        <div class="nav-item" id="navReward"><i class="fa-solid fa-gift"></i><span>リワード</span></div>
        <div class="nav-item" id="navHousehold"><i class="fa-solid fa-chart-pie"></i><span>家計簿</span></div>
        <div class="nav-item" id="navSend"><i class="fa-solid fa-arrows-rotate"></i><span>送金・請求</span></div>
        <div class="nav-item" id="navAccount"><i class="fa-solid fa-user"></i><span>アカウント</span></div>
    </div>

    <div class="toast" id="toast">現在サービスはご利用いただけません</div>
</div>

<script>
    const homeScreen = document.getElementById('homeScreen');
    const historyScreen = document.getElementById('historyScreen');
    const mainHeader = document.getElementById('mainHeader');
    const navBar = document.getElementById('navBar');
    const toast = document.getElementById('toast');
    const historyBtn = document.getElementById('historyBtn');
    const balanceBtn = document.getElementById('balanceBtn');
    const historyBackBtn = document.getElementById('historyBackBtn');

    // トースト表示
    function showUnavailableToast() {
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // 履歴を完全全画面で開く
    function openHistory() {
        homeScreen.style.display = 'none';
        mainHeader.style.display = 'none';
        navBar.style.display = 'none'; 
        historyScreen.style.display = 'block';
    }

    // 元のホーム画面に戻る
    function closeHistory() {
        homeScreen.style.display = 'block';
        mainHeader.style.display = 'flex';
        navBar.style.display = 'flex';
        historyScreen.style.display = 'none';
    }

    // イベント登録
    historyBtn.addEventListener('click', openHistory);
    balanceBtn.addEventListener('click', openHistory);
    historyBackBtn.addEventListener('click', closeHistory);

    // その他ボタンの無効化処理
    const lockedElements = [
        'pointBtn', 'withdrawBtn', 'chargeBtn', 'gpayBtn', 'banner1', 'banner2',
        'navReward', 'navHousehold', 'navSend', 'navAccount', 'bellIcon', 'cardIcon'
    ];

    lockedElements.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showUnavailableToast();
            });
        }
    });

    document.getElementById('navWallet').addEventListener('click', () => {
        if (historyScreen.style.display === 'block') {
            closeHistory();
        }
    });
</script>

</body>
</html>
