<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格シミュレーションゲーム基礎</title>
    <style>
    /* 画面全体の基本設定 */
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 10px;
        box-sizing: border-box;
    }

    /* ゲームの外枠 */
    #game-container {
        background-color: #fff;
        border-radius: 12px;
        overflow: hidden;
        width: 100%;       
        max-width: 480px;  
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        position: relative;
    }

    /* 🛠️ 初期設定（プロフィール入力）画面 */
    #setup-screen {
        padding: 25px;
        box-sizing: border-box;
    }
    #setup-screen h2 {
        margin-top: 0;
        font-size: 20px;
        color: #2c3e50;
    }
    .form-group {
        margin-bottom: 20px; 
        text-align: left;
    }
    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 15px;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 12px; 
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px; 
    }
    #start-btn {
        background-color: #2ecc71;
        color: white;
        border: none;
        padding: 14px; 
        font-size: 18px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
    }

    /* 🎮 ゲーム本編画面 */
    #game-screen {
        display: none;
    }
    
    #status-window {
        background-color: #f8f9fa;
        border-bottom: 1px solid #ddd;
        padding: 12px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
    }

    /* 📸 ステージ（画像）エリア */
    #stage-area {
        width: 100%;
        height: 60vw; 
        max-height: 300px;
        position: relative;
        background-color: #e0e0e0;
        background-size: cover;
        background-position: center;
    }
    #character-img {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        max-height: 95%;
    }

    #text-window {
        background-color: rgba(255, 255, 255, 0.9);
        border-top: 2px solid #ff69b4;
        min-height: 90px;
        padding: 15px;
        font-size: 16px; 
        line-height: 1.6;
        box-sizing: border-box;
    }

    #choices-container {
        padding: 0 15px 15px 15px;
    }
    .choice-btn {
        display: block;
        width: 100%;
        padding: 12px; 
        margin-bottom: 10px;
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }
    .choice-btn:hover { background-color: #ff1493; }

    #system-menu {
        display: flex;
        justify-content: space-around;
        padding: 8px;
        background: #eee;
    }
    .sys-btn {
        background: #7f8c8d;
        color: white;
        border: none;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
    }
</style>

</head>
<body>

<div id="game-container">

    <div id="setup-screen">
        <h2>プレイヤー設定</h2>
        <div class="form-group">
            <label>名前（キャラに呼ばれる呼び名）：</label>
            <input type="text" id="input-name" value="">
        </div>
        <div class="form-group">
            <label>生年月日：</label>
            <input type="date" id="input-birthday" value="2008-01-01">
        </div>
        <div class="form-group">
            <label>性別：</label>
            <select id="input-gender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="その他">その他</option>
            </select>
        </div>
        <button id="start-btn" onclick="startGame()">ゲーム開始！</button>
    </div>

    <div id="game-screen">
        <div id="system-menu">
            <button class="sys-btn" onclick="saveGame()">💾 セーブ（ブラウザ保存）</button>
            <button class="sys-btn" onclick="loadGame()">📂 ロード</button>
        </div>

        <div id="status-window">
            <div>👤 <span id="status-player">---</span></div>
            <div>📅 <span id="status-day">1</span>日目</div>
            <div>❤️ 好感: <span id="status-love">0</span></div>
        </div>

        <div id="stage-area">
            <img id="character-img" src="" alt="ヒロイン立ち絵">
        </div>

        <div id="text-window">
            <p id="game-text">ここに文章が入るで。</p>
        </div>

        <div id="choices-container"></div>
    </div>

</div>

<script>
// ==========================================
// 1. ゲームの状態管理（ステータス）※energyを完全に削除
// ==========================================
let gameState = {
    name: "",
    birthday: "", 
    age: 0,       
    gender: "",
    day: 1,
    love: 0,
    currentScene: "intro" 
};

// ==========================================
// 2. 生年月日から現在の満年齢を計算する関数
// ==========================================
function calcAge(birthdayStr) {
    if (!birthdayStr) return 0;
    
    const birthDate = new Date(birthdayStr);
    const today = new Date(); 

    let age = today.getFullYear() - birthDate.getFullYear();
    
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    
    return age;
}

// ==========================================
// 3. 初期設定からゲームを開始する関数
// ==========================================
function startGame() {
    gameState.name = document.getElementById('input-name').value.trim();
    gameState.gender = document.getElementById('input-gender').value;
    gameState.birthday = document.getElementById('input-birthday').value; 

    if (!gameState.name) {
        alert("名前を入力してや！");
        return;
    }
    if (!gameState.birthday) {
        alert("生年月日を入力してや！");
        return;
    }

    // 年齢を自動計算してセット
    gameState.age = calcAge(gameState.birthday);

    // 画面の切り替え
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    goToScene("intro");
}

// ==========================================
// 4. シーン切り替え処理 ※status-energyの更新を削除
// ==========================================
function goToScene(sceneName) {
    gameState.currentScene = sceneName;
    
    // ステータス表示を更新
    document.getElementById('status-player').innerText = `${gameState.name}(${gameState.age}歳・${gameState.gender})`;
    document.getElementById('status-day').innerText = gameState.day;
    document.getElementById('status-love').innerText = gameState.love;

    const stage = document.getElementById('stage-area');
    const chImg = document.getElementById('character-img');

    if (sceneName === "intro") {
        stage.style.backgroundImage = "url('う')"; 
        chImg.src = "ぷんぷん.webp"; 
        chImg.style.display = "block"; 

        updateTextAndChoices(
            `「あ、${gameState.name}！やっと来た。遅いねんから！」\n幼馴染（野生）のつむぎが怒っている。`,
            [
                { text: "謝る", action: () => { gameState.love += 5; goToScene("talk"); } }, // 💡 energyの計算を削除
                { text: "からかう", action: () => { gameState.love -= 10; goToScene("tease"); } }
            ]
        );
    } 
    else if (sceneName === "talk") {
        stage.style.backgroundImage = "url('https://picsum.photos/480/300?random=3')"; 
        chImg.src = "https://picsum.photos/150/280?random=4"; 
        
        updateTextAndChoices(
            `「そんなんで許されると思ってん？」\nつむぎはまだまだ怒っている（好感度が5上がった！）`,
            [{ text: "次の行動へ", action: () => { nextStep(); } }]
        );
    } 
    else if (sceneName === "tease") {
        updateTextAndChoices(
            `「え、お前殺すで？」\nつむぎはポケットから何かを出そうとする`,
            [{ text: "次の行動へ", action: () => { nextStep(); } }]
        );
    }
}

function updateTextAndChoices(text, choices) {
    document.getElementById('game-text').innerText = text;
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.innerText = choice.text;
        btn.className = 'choice-btn';
        btn.onclick = choice.action;
        container.appendChild(btn);
    });
}

function nextStep() {
    alert("デモはここまでやで！");
}

// ==========================================
// 5. セーブ ＆ ロード機能
// ==========================================
function saveGame() {
    localStorage.setItem('eroge_basic_save', JSON.stringify(gameState));
    alert("データをセーブ（バックアップ）したで！");
}

function loadGame() {
    const savedData = localStorage.getItem('eroge_basic_save');
    if (!savedData) {
        alert("セーブデータが見つからへんで！");
        return;
    }
    gameState = JSON.parse(savedData);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    goToScene(gameState.currentScene);
    alert("データをロードしたで！");
}
</script>

</body>
</html>
